<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="100%">
  <defs>
    <!-- Background glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Julia Canonical Colors (Radial Gradients for depth) -->
    <radialGradient id="juliaRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B60" />
      <stop offset="60%" stop-color="#E03E33" />
      <stop offset="100%" stop-color="#B32117" />
    </radialGradient>
    <radialGradient id="juliaPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BA7FE0" />
      <stop offset="60%" stop-color="#9558B2" />
      <stop offset="100%" stop-color="#6F318C" />
    </radialGradient>
    <radialGradient id="juliaGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#56D63E" />
      <stop offset="60%" stop-color="#389826" />
      <stop offset="100%" stop-color="#236B15" />
    </radialGradient>

    <!-- Crystal Facet Gradients (Lean 4 Origami Prism) -->
    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetTopRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="facetMidRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetMidLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Typography Gradients -->
    <linearGradient id="juGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="leanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 76px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: #475569;
    }
    .brand-subtext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      fill: #64748B;
    }
    .facet-border {
      stroke: #E0E7FF;
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-opacity: 0.6;
    }
    .ambient-halo {
      fill: #6366F1;
      opacity: 0.12;
      filter: blur(28px);
    }
    @media (prefers-color-scheme: dark) {
      .brand-tagline { fill: #CBD5E1; }
      .brand-subtext { fill: #94A3B8; }
      .facet-border { stroke: #818CF8; stroke-opacity: 0.5; }
      .ambient-halo { opacity: 0.22; fill: #818CF8; }
    }
  </style>

  <!-- Ambient Backdrop Halo behind emblem -->
  <circle class="ambient-halo" cx="120" cy="110" r="85" />

  <!-- EMBLEM GROUP (Center at (120, 110)) -->
  <g id="emblem" transform="translate(0, 0)">
    <!-- Lean 4 Proof Prism / Facets -->
    <!-- Top-Left Facet -->
    <polygon points="120,24 120,110 55,68" fill="url(#facetTopLeft)" class="facet-border" />
    <!-- Top-Right Facet -->
    <polygon points="120,24 185,68 120,110" fill="url(#facetTopRight)" class="facet-border" />
    <!-- Mid-Right Facet -->
    <polygon points="120,110 185,68 185,152" fill="url(#facetMidRight)" class="facet-border" />
    <!-- Bottom-Right Facet -->
    <polygon points="120,110 185,152 120,196" fill="url(#facetBottomRight)" class="facet-border" />
    <!-- Bottom-Left Facet -->
    <polygon points="120,110 120,196 55,152" fill="url(#facetBottomLeft)" class="facet-border" />
    <!-- Mid-Left Facet -->
    <polygon points="120,110 55,152 55,68" fill="url(#facetMidLeft)" class="facet-border" />

    <!-- Mathematical Turnstile & Lambda Structure (Mechanized Proof Core) -->
    <!-- Stylized Lambda / Turnstile Path -->
    <path d="M 98 84 L 118 110 L 142 142 M 118 110 L 98 142" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#nodeGlow)" />
    <!-- Horizontal Provability / Verification Bar -->
    <path d="M 88 110 L 152 110" 
          fill="none" 
          stroke="#E0F2FE" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-dasharray="2 3"
          opacity="0.8" />

    <!-- Center Certificate Sparkle (Verified Point) -->
    <circle cx="120" cy="110" r="4.5" fill="#FFFFFF" filter="url(#nodeGlow)" />

    <!-- Outer Structural Wireframe Edges for precision feeling -->
    <polygon points="120,24 185,68 185,152 120,196 55,152 55,68" 
             fill="none" 
             stroke="#C7D2FE" 
             stroke-width="2.5" 
             stroke-linecap="round" 
             stroke-linejoin="round" 
             opacity="0.8" />

    <!-- The 3 Julia Spheres at Canonical Vertices -->
    <!-- 1. Red Julia Node (Top Apex) -->
    <g filter="url(#nodeGlow)">
      <circle cx="120" cy="24" r="15" fill="url(#juliaRed)" />
      <circle cx="116" cy="19" r="4" fill="#FFA49E" opacity="0.75" />
    </g>

    <!-- 2. Green Julia Node (Bottom-Right Vertex) -->
    <g filter="url(#nodeGlow)">
      <circle cx="185" cy="152" r="15" fill="url(#juliaGreen)" />
      <circle cx="181" cy="147" r="4" fill="#8CE87B" opacity="0.75" />
    </g>

    <!-- 3. Purple Julia Node (Bottom-Left Vertex) -->
    <g filter="url(#nodeGlow)">
      <circle cx="55" cy="152" r="15" fill="url(#juliaPurple)" />
      <circle cx="51" cy="147" r="4" fill="#DDB1F5" opacity="0.75" />
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP (Starts x=232) -->
  <g transform="translate(232, 0)">
    <!-- JuLean.jl Title -->
    <text class="brand-title" x="0" y="115">
      <tspan fill="url(#juGradient)">Ju</tspan><tspan fill="url(#leanGradient)">Lean</tspan><tspan fill="#10B981" font-weight="600">.jl</tspan>
    </text>

    <!-- Tagline (Uppercase tracked) -->
    <text class="brand-tagline" x="4" y="152">FAST AS JULIA. RIGOROUS AS LEAN.</text>

    <!-- Subtext -->
    <text class="brand-subtext" x="4" y="182">Design-by-Contract  •  SMT Falsification  •  Mechanized Lean 4 Proofs</text>
  </g>
</svg>
