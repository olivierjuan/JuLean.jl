name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia dependencies
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run test suite
        uses: julia-actions/julia-runtest@v1

  formal_verification:
    name: Lean 4 & Mathlib Verification Gate
    runs-on: ubuntu-latest
    needs: test
    env:
      MATHLIB_VERSION: "v4.35.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia 1.10
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install Elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib Lake Build
        uses: actions/cache@v4
        id: cache-mathlib
        with:
          path: mathlib4/.lake
          key: mathlib-${{ runner.os }}-${{ env.MATHLIB_VERSION }}

      - name: Setup Mathlib4 project & fetch olean cache
        run: |
          if [ ! -d mathlib4/.lake ]; then
            rm -rf mathlib4
            git clone --depth 1 --branch "$MATHLIB_VERSION" https://github.com/leanprover-community/mathlib4.git
          fi
          cd mathlib4
          lake exe cache get
          cd ..
          echo "LEAN_PROJECT_DIR=$PWD/mathlib4" >> $GITHUB_ENV

      - name: Run JuLean formal verification with Lean 4 & Mathlib
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
