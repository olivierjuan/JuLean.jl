<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softGlowIcon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlowIcon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="juliaRedIcon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B60" />
      <stop offset="60%" stop-color="#E03E33" />
      <stop offset="100%" stop-color="#B32117" />
    </radialGradient>
    <radialGradient id="juliaPurpleIcon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BA7FE0" />
      <stop offset="60%" stop-color="#9558B2" />
      <stop offset="100%" stop-color="#6F318C" />
    </radialGradient>
    <radialGradient id="juliaGreenIcon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#56D63E" />
      <stop offset="60%" stop-color="#389826" />
      <stop offset="100%" stop-color="#236B15" />
    </radialGradient>

    <linearGradient id="facetTopLeftIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetTopRightIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="facetMidRightIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetBottomRightIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetBottomLeftIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="facetMidLeftIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .facet-border-icon {
      stroke: #E0E7FF;
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-opacity: 0.6;
    }
    .ambient-halo-icon {
      fill: #6366F1;
      opacity: 0.15;
      filter: blur(28px);
    }
    @media (prefers-color-scheme: dark) {
      .facet-border-icon { stroke: #818CF8; stroke-opacity: 0.5; }
      .ambient-halo-icon { opacity: 0.25; fill: #818CF8; }
    }
  </style>

  <!-- Ambient Backdrop Halo -->
  <circle class="ambient-halo-icon" cx="120" cy="120" r="95" />

  <!-- EMBLEM GROUP (Centered at (120, 120)) -->
  <g transform="translate(0, 10)">
    <!-- Lean 4 Proof Prism / Facets -->
    <polygon points="120,24 120,110 55,68" fill="url(#facetTopLeftIcon)" class="facet-border-icon" />
    <polygon points="120,24 185,68 120,110" fill="url(#facetTopRightIcon)" class="facet-border-icon" />
    <polygon points="120,110 185,68 185,152" fill="url(#facetMidRightIcon)" class="facet-border-icon" />
    <polygon points="120,110 185,152 120,196" fill="url(#facetBottomRightIcon)" class="facet-border-icon" />
    <polygon points="120,110 120,196 55,152" fill="url(#facetBottomLeftIcon)" class="facet-border-icon" />
    <polygon points="120,110 55,152 55,68" fill="url(#facetMidLeftIcon)" class="facet-border-icon" />

    <!-- Mathematical Turnstile & Lambda Structure -->
    <path d="M 98 84 L 118 110 L 142 142 M 118 110 L 98 142" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#nodeGlowIcon)" />
    <path d="M 88 110 L 152 110" 
          fill="none" 
          stroke="#E0F2FE" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-dasharray="2 3"
          opacity="0.85" />

    <circle cx="120" cy="110" r="5" fill="#FFFFFF" filter="url(#nodeGlowIcon)" />

    <!-- Outer Structural Wireframe Edges -->
    <polygon points="120,24 185,68 185,152 120,196 55,152 55,68" 
             fill="none" 
             stroke="#C7D2FE" 
             stroke-width="2.5" 
             stroke-linecap="round" 
             stroke-linejoin="round" 
             opacity="0.85" />

    <!-- The 3 Julia Spheres -->
    <!-- Red Julia Node (Top) -->
    <g filter="url(#nodeGlowIcon)">
      <circle cx="120" cy="24" r="16" fill="url(#juliaRedIcon)" />
      <circle cx="116" cy="19" r="4.5" fill="#FFA49E" opacity="0.8" />
    </g>

    <!-- Green Julia Node (Bottom-Right) -->
    <g filter="url(#nodeGlowIcon)">
      <circle cx="185" cy="152" r="16" fill="url(#juliaGreenIcon)" />
      <circle cx="181" cy="147" r="4.5" fill="#8CE87B" opacity="0.8" />
    </g>

    <!-- Purple Julia Node (Bottom-Left) -->
    <g filter="url(#nodeGlowIcon)">
      <circle cx="55" cy="152" r="16" fill="url(#juliaPurpleIcon)" />
      <circle cx="51" cy="147" r="4.5" fill="#DDB1F5" opacity="0.8" />
    </g>
  </g>
</svg>
