# JuLean.jl — GitLab CI Pipeline
# Formal Verification & Contract Testing

stages:
  - test
  - formal_verification

default:
  image: julia:1.10
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - julia --project -e 'using Pkg; Pkg.instantiate()'

test:unit:
  stage: test
  script:
    - julia --project -e 'using Pkg; Pkg.test()'

test:smt:
  stage: test
  script:
    - julia --project test/runtests.jl

formal_verification:lean4:
  stage: formal_verification
  script:
    - curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
    - export PATH="$HOME/.elan/bin:$PATH"
    - lean --version
    - julia --project test/runtests.jl
  allow_failure: true
